<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f263d"/>
      <stop offset="60%" stop-color="#081726"/>
      <stop offset="100%" stop-color="#040c14"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonCoral" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="triangleStroke" x1="20%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#00c0fa"/>
      <stop offset="65%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ff4757"/>
    </linearGradient>

    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff4757" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGlow)" />

  <!-- Ambient light glows behind triangle -->
  <circle cx="390" cy="360" r="140" fill="#00d2ff" opacity="0.18" filter="blur(50px)"/>
  <circle cx="620" cy="400" r="140" fill="#ff4757" opacity="0.18" filter="blur(50px)"/>

  <!-- Glowing Play-Button Triangle Shape -->
  <g transform="translate(0, -30)">
    <!-- Outer Glow Underlay -->
    <path d="M 370 210
             C 390 195, 415 195, 435 208
             L 665 348
             C 685 360, 695 382, 690 405
             C 685 425, 670 440, 650 450
             L 420 575
             C 400 585, 375 580, 360 565
             C 345 550, 340 525, 340 500
             L 340 270
             C 340 245, 350 225, 370 210 Z"
          fill="url(#innerGlow)"
          stroke="url(#triangleStroke)"
          stroke-width="32"
          stroke-linejoin="round"
          stroke-linecap="round"
          filter="url(#neonCyan)"
    />

    <!-- Sharp Triangle Contour -->
    <path d="M 370 210
             C 390 195, 415 195, 435 208
             L 665 348
             C 685 360, 695 382, 690 405
             C 685 425, 670 440, 650 450
             L 420 575
             C 400 585, 375 580, 360 565
             C 345 550, 340 525, 340 500
             L 340 270
             C 340 245, 350 225, 370 210 Z"
          fill="none"
          stroke="url(#triangleStroke)"
          stroke-width="26"
          stroke-linejoin="round"
          stroke-linecap="round"
    />

    <!-- Secondary offset glass layer (3D depth effect) -->
    <path d="M 390 225
             L 645 365
             L 425 490
             L 360 480
             Z"
          fill="none"
          stroke="#00ffff"
          stroke-width="3"
          opacity="0.35"
    />

    <!-- Central Monogram Emblem: Circle with stylized 'bf' -->
    <g transform="translate(470, 385)">
      <!-- Outer circle of monogram -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="#ffffff" stroke-width="17" />
      
      <!-- Stem of b rising on left -->
      <path d="M -76 -8 L -76 -70 C -76 -82, -65 -88, -55 -80 C -45 -72, -45 -60, -45 -48 L -45 0" 
            fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round"/>

      <!-- Crossbar and central F stroke -->
      <path d="M -20 -38 L 22 -38" 
            fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
      <path d="M -20 0 L 15 0" 
            fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
      <path d="M -20 -70 L -20 45" 
            fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography -->
  <!-- BRUNO FREIRE -->
  <text x="512" y="700"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Arial, sans-serif"
        font-weight="900"
        font-size="78"
        letter-spacing="5"
        fill="#ffffff"
        text-anchor="middle">BRUNO FREIRE</text>

  <!-- PERSONAL TRAINER -->
  <text x="512" y="765"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Arial, sans-serif"
        font-weight="600"
        font-size="34"
        letter-spacing="14"
        fill="#ffffff"
        opacity="0.95"
        text-anchor="middle">PERSONAL TRAINER</text>
</svg>